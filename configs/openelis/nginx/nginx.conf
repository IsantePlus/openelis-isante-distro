worker_processes 1;

events { worker_connections 1024; }
http {
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen [::]:443 ssl;
        listen 443 ssl default_server;
        server_name _ localhost;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # To forward the original client's IP address
        proxy_set_header X-Forwarded-Proto $scheme; # to forward the  original protocol (HTTP or HTTPS)
        proxy_set_header Host $host; # to forward the original host requested by the client

       absolute_redirect off;

        # Docker's embedded DNS, re-resolved per request instead of once at nginx startup: a
        # proxy_pass with a bare hostname fails to start nginx at all ("host not found in
        # upstream") if that container isn't up yet, taking down every route below with it
        # (including /api/, which has nothing to do with the frontend). A resolved variable
        # degrades to a 502 on that one route instead, and recovers on its own once the
        # container comes back — no manual restart needed.
        resolver 127.0.0.11 valid=10s;

        location / {
            set $frontend_upstream http://frontend.openelis.org;
            proxy_pass $frontend_upstream;
            proxy_redirect     off;
        }

        location /api/ {
            # No trailing path after the variable: nginx then forwards the original request URI
            # unchanged (it already starts with /api/, same as the location prefix) instead of
            # doing its usual static "replace the matched prefix" rewrite, which silently drops
            # everything after the resolved upstream when the proxy_pass target contains a
            # variable — this exact location shipped with that bug for a few hours on 2026-10-02.
            set $webapp_upstream https://oe.openelis.org:8443;
            proxy_pass         $webapp_upstream;
            proxy_redirect     off;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $server_name;
        }
    }

    # Analyzer bridge upload UI. SNI/Host routes any `bridge.*` hostname here
    # (bridge.localhost, bridge.<deployment>.*, …); every other host falls
    # through to the default_server above (the frontend). The bridge speaks
    # self-signed TLS + HTTP Basic Auth (OE admin creds via BRIDGE_SECURITY_*
    # on the openelis-analyzer-bridge service). Bridge "/" is POST-only and
    # Spring does not auto-resolve /admin/upload/ -> index.html, so redirect
    # the common entry points.
    server {
        listen [::]:443 ssl;
        listen 443 ssl;
        server_name ~^bridge\.;

        ssl_certificate /etc/nginx/certs/apache-selfsigned.crt;
        ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        absolute_redirect off;
        resolver 127.0.0.11 valid=10s;  # see comment on the main server block above

        location = /              { return 301 /admin/upload/index.html; }
        location = /admin/upload  { return 301 /admin/upload/index.html; }
        location = /admin/upload/ { return 301 /admin/upload/index.html; }

        location / {
            set $bridge_upstream https://bridge.openelis.org:8443;
            proxy_pass         $bridge_upstream;
            proxy_redirect     off;
            proxy_ssl_verify   off;
            proxy_ssl_server_name on;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            client_max_body_size 32m;  # result spreadsheets (.xlsx/.ods) can be large
        }
    }
}
