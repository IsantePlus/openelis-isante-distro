worker_processes 1;

events { worker_connections 256; }

http {
    # Docker's embedded DNS. The upstream is resolved at request time (variable in proxy_pass),
    # so nginx still starts when the FHIR container is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8445;
        server_name _;
        client_max_body_size 32m;

        # The OpenHIM authenticates here with the route credentials (Basic Auth).
        auth_basic           "OpenELIS FHIR gateway";
        auth_basic_user_file /etc/nginx/fhir-gateway.htpasswd;

        location / {
            set $fhir_upstream https://fhir.openelis.org:8443;
            proxy_pass $fhir_upstream;

            # Client certificate accepted by the FHIR server (clientAuth=true). Same self-signed
            # pair generated by the `certs` service that the OpenHIM used to present.
            proxy_ssl_certificate     /etc/nginx/certs/apache-selfsigned.crt;
            proxy_ssl_certificate_key /etc/nginx/keys/apache-selfsigned.key;
            # The FHIR server certificate is self-signed and only reachable on the internal
            # Docker network (same trade-off as the analyzer bridge proxy in ../nginx/nginx.conf).
            proxy_ssl_verify          off;
            proxy_ssl_server_name     on;

            # The gateway credentials are not meant for the FHIR server.
            proxy_set_header Authorization "";
            proxy_read_timeout 120s;
        }
    }
}
