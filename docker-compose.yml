    #OpenHIM -IOL
    mongo:
        image: mongo:3.4
        container_name: openhim-mongo
        ports:
            - "27017:27017"
       
    openhim-core:
        container_name: openhim-core
        image: jembi/openhim-core:v7.1.0
        restart: unless-stopped
        environment:
            - mongo_url=mongodb://mongo/openhim
            - mongo_atnaUrl=mongodb://mongo/openhim
            - NODE_EXTRA_CA_CERTS=/etc/nginx/certs/apache-selfsigned.crt
        healthcheck:
            test: "node /healthcheck.js"
            interval: 20s
            timeout: 20s
            retries: 2
        volumes:
            - ./configs/openhim/configs/healthcheck.js:/healthcheck.js
            - ./configs/openhim/configs/openhim-core_default.json:/app/config/default.json
            - certs-vol:/etc/nginx/certs/
            - keys-vol:/etc/nginx/keys/
        ports:
            - "8085:8080"
            # - "5000:5000"
            - "5001:5001"
            - "5050:5050"
            - "5051:5051"
            - "5052:5052"
            - "7788:7788" 
        depends_on:
            - mongo

    openhim-console:
        container_name: openhim-console
        image: jembi/openhim-console:v1.15.0
        ports:
            - "9000:80"
        volumes:
            - ./configs/openhim/configs/default.json:/usr/share/nginx/html/config/default.json
        depends_on:
            - openhim-core   
            - openhim-config 
        healthcheck:
            test: "curl -sS http://openhim-console || exit 1"
            interval: 10s
            timeout: 60s
            retries: 3

    # Loads Default OpenHIM Config
    openhim-config:
        container_name: openhim-config
        image: ghcr.io/digi-uw/openhim-config:v0.0.0
        platform: linux/amd64
        volumes:
            - ./configs/openhim/configs/openhim-config.json:/app/test-openhim-config.json

    openelis-analyzer-bridge:
        container_name: openelis-analyzer-bridge
        image: itechuw/openelis-analyzer-bridge:3.0.3
        platform: linux/amd64
        depends_on:
            certs:
                condition: service_completed_successfully
        ports:
            - "8442:8443" # HTTPS API port
            - "12000:12001" # ASTM listen port
        volumes:
            - ./configs/openelis/astm/configuration.yml:/app/configuration.yml:ro
            -  key_trust-store-volume:/etc/openelis-global
            - analyzer-imports:/data/analyzer-imports
            # Host filesystem for real analyzer file drops (NFS, USB, etc.).
            # Read-only: the bridge must never delete or move source files.
            - ${ANALYZER_HOST_MOUNT:-./configs/openelis/analyzer-drops}:/data/analyzer-drops:ro
            # Durable state store for the bridge's FileStateStore (SQLite, WAL mode).
            # Held on a dedicated named volume rather than sharing analyzer-imports
            # or the ${ANALYZER_HOST_MOUNT} bind mount, so state survives container
            # recreation and the source mount can stay read-only.
            - bridge-state:/data/openelis-analyzer-bridge
        environment:
            SPRING_PROFILES_ACTIVE: dev
            BRIDGE_FILE_ENABLED: "true"
            # Point the bridge at the named volume mount. Must match the
            # volume mount path above. Spring Boot maps this env var to the
            # bridge.file.state-store-path config property.
            BRIDGE_FILE_STATE_STORE_PATH: /data/openelis-analyzer-bridge/state.db
            LOGGING_LEVEL_ORG_ITECH: TRACE
            # Align with CI harness: HttpForwardingRouter appends /astm, /hl7, /csv
            ORG_ITECH_AHB_FORWARD_HTTP_SERVER_URI: https://openelisglobal-webapp:8443/OpenELIS-Global/analyzer
            ORG_ITECH_AHB_FORWARD_HTTP_SERVER_USERNAME: ${ORG_ITECH_AHB_FORWARD_HTTP_SERVER_USERNAME:-admin}
            ORG_ITECH_AHB_FORWARD_HTTP_SERVER_PASSWORD: ${OE_ADMIN_PASSWORD:-adminADMIN!}
            ORG_ITECH_AHB_FORWARD_HTTP_SERVER_INSECURE_TLS: "true"
            JDK_JAVA_OPTIONS: -Djdk.internal.httpclient.disableHostnameVerification=true
            JAVA_OPTS: |
                -Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH:-/etc/openelis-global/truststore}
                -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD:-tspass}
                -Djavax.net.ssl.trustStoreType=pkcs12
        restart: unless-stopped

                
secrets:
  common.properties:
    file:  ./configs/openelis/properties/common.properties   

        
volumes:
  oe-db-data:
  key_trust-store-volume:
  certs-vol:
  keys-vol:
  isanteplus-data: 
  isanteplus-db-data: 
  hapi-data:
  hapi-fhir-db:
  analyzer-imports:
  # Durable FileStateStore for the analyzer bridge — must survive container
  # recreation so processing state (PROCESSED / FAILED / RETRYING) is not lost.
  bridge-state: